[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-evidence-rag"
version = "0.1.0"
description = "Hybrid-retrieval RAG over PubMed abstracts with citation enforcement, abstention, and hallucination evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "streamlit>=1.35,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "chromadb>=0.5,<2",
    "sentence-transformers>=3.0,<6",
    "transformers>=4.41,<5",
    "torch>=2.2,<3",
    "rank-bm25>=0.2.2,<0.3",
    "httpx>=0.27,<1",
    "ragas>=0.2,<1",
    "langchain-openai>=0.2,<2",
    # ragas 0.4.x imports langchain_community.chat_models.vertexai, removed in 0.4.
    "langchain-community>=0.3,<0.4",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
